name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    name: Build & package main version
    # Apple Silicon runner with modern Xcode: can compile both arm64 and x86_64
    # slices and merge them with lipo into a Universal binary.
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build app (universal)
        env:
          REQUIRE_UNIVERSAL: "1"
          REQUIRE_SIGNING: "0"
        run: ./build.sh

      - name: Package DMG
        run: ./make_dmg.sh

      - name: Verify universal binary & localizations
        run: |
          ARCHS="$(lipo -archs dist/MusicAlarm.app/Contents/MacOS/MusicAlarm)"
          echo "$ARCHS"
          grep -Eq '(^| )arm64( |$)' <<< "$ARCHS"
          grep -Eq '(^| )x86_64( |$)' <<< "$ARCHS"
          echo "Localizations:"
          find dist/MusicAlarm.app/Contents/Resources -name '*.lproj' -maxdepth 1 | sort

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: music-alarm-universal-dmg
          path: dist/MusicAlarm.dmg
          if-no-files-found: error
