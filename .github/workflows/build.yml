name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    name: Build & package main version
    # Apple Silicon runner with modern Xcode: can compile both arm64 and x86_64
    # slices and merge them with lipo into a Universal binary.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app (universal)
        run: ./build.sh

      - name: Package DMG
        run: ./make_dmg.sh

      - name: Verify universal binary & localizations
        run: |
          lipo -info dist/MusicAlarm.app/Contents/MacOS/MusicAlarm
          echo "Localizations:"
          find dist/MusicAlarm.app/Contents/Resources -name '*.lproj' -maxdepth 1 | sort

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-alarm-universal-dmg
          path: dist/MusicAlarm.dmg

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: music-alarm-universal-dmg
          path: dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/MusicAlarm.dmg \
            --title "Music Alarm ${GITHUB_REF_NAME}" \
            --notes "Universal build (Intel + Apple Silicon). Drag the .app from the DMG into Applications to install."